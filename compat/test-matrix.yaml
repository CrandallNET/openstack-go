# Initial live/static test matrix for golang-osc.
suites:
  - name: "command catalog generation"
    oracle: "python-openstackclient"
    service: "cli"
    risk: "static"
    role: "none"
    allowed_clouds: []
    setup: "none"
    cleanup: "none"
    skip_reasons: []
    notes: "Uses local Python OSC only."
  - name: "parser and help parity"
    oracle: "python-openstackclient"
    service: "cli"
    risk: "static"
    role: "none"
    allowed_clouds: []
    setup: "none"
    cleanup: "none"
    skip_reasons: []
    notes: "Covers command paths, help snapshots, invalid commands, invalid flags, and completion."
  - name: "renderer parity"
    oracle: "python-openstackclient"
    service: "cli"
    risk: "static"
    role: "none"
    allowed_clouds: []
    setup: "fixed rows"
    cleanup: "none"
    skip_reasons: []
    notes: "Covers OSC formats and Go-only pretty output."
  - name: "auth config precedence"
    oracle: "python-openstackclient"
    service: "identity"
    risk: "read"
    role: "project"
    allowed_clouds:
      - "cloud6"
      - "flex-sjc"
      - "flex-dfw"
      - "flex-iad"
    setup: "local non-secret cloud config"
    cleanup: "none"
    skip_reasons:
      - "endpoint-missing"
      - "fixture-missing"
    notes: "May use cloud names but must not persist secrets."
  - name: "token issue and service catalog"
    oracle: "python-openstackclient"
    service: "identity"
    risk: "read"
    role: "project"
    allowed_clouds:
      - "cloud6"
      - "flex-sjc"
      - "flex-dfw"
      - "flex-iad"
    setup: "configured cloud credential"
    cleanup: "none"
    skip_reasons:
      - "endpoint-missing"
      - "policy-denied"
    notes: "First live gate for every configured cloud."
  - name: "service discovery"
    oracle: "python-openstackclient"
    service: "common"
    risk: "read"
    role: "project"
    allowed_clouds:
      - "cloud6"
      - "flex-sjc"
      - "flex-dfw"
      - "flex-iad"
    setup: "configured cloud credential"
    cleanup: "none"
    skip_reasons:
      - "endpoint-missing"
    notes: "Records catalog services, regions, interfaces, versions, and extension lists."
  - name: "identity admin read write"
    oracle: "python-openstackclient"
    service: "identity"
    risk: "admin-write"
    role: "admin"
    allowed_clouds:
      - "cloud6"
    setup: "golang-osc-testing project"
    cleanup: "test-created resources only"
    skip_reasons:
      - "role-missing"
      - "policy-denied"
    notes: "Admin tests are cloud6-only unless future credentials grant admin elsewhere."
  - name: "compute read"
    oracle: "python-openstackclient"
    service: "compute"
    risk: "read"
    role: "project"
    allowed_clouds:
      - "cloud6"
      - "flex-sjc"
      - "flex-dfw"
      - "flex-iad"
    setup: "service discovery"
    cleanup: "none"
    skip_reasons:
      - "service-missing"
      - "endpoint-missing"
      - "policy-denied"
    notes: "Run where Nova exists."
  - name: "compute project lifecycle"
    oracle: "python-openstackclient"
    service: "compute"
    risk: "write-cleanup"
    role: "project"
    allowed_clouds:
      - "cloud6"
      - "flex-sjc"
      - "flex-dfw"
      - "flex-iad"
    setup: "dynamic image flavor network quota discovery"
    cleanup: "test-created resources only"
    skip_reasons:
      - "service-missing"
      - "quota-missing"
      - "fixture-missing"
      - "unsafe-remote-write"
    notes: "Never delete existing servers, keys, networks, or images."
  - name: "compute admin operations"
    oracle: "python-openstackclient"
    service: "compute"
    risk: "admin-write"
    role: "admin"
    allowed_clouds:
      - "cloud6"
    setup: "service discovery"
    cleanup: "test-created resources only"
    skip_reasons:
